<!DOCTYPE html>
<html>
<head>
    <title>Edit Surprise Box</title>
</head>
<body>
    <h1>Edit Surprise Box</h1>
    <form method="POST">
        <label>Title:</label><br>
        <input type="text" name="title" value="{{ box[2] }}" required><br><br>

        <label>Description:</label><br>
        <textarea name="description" rows="3" cols="40" required>{{ box[3] }}</textarea><br><br>

        <label>Original Price ($):</label><br>
        <input type="number" step="0.01" name="original_price" value="{{ box[4] }}" required><br><br>

        <label>Discounted Price ($):</label><br>
        <input type="number" step="0.01" name="discounted_price" value="{{ box[5] }}" required><br><br>

        <label>Quantity Available:</label><br>
        <input type="number" name="quantity" value="{{ box[6] }}" required><br><br>

        <label>Pickup Start:</label><br>
        <input type="text" name="pickup_start" value="{{ box[7] }}" required><br><br>

        <label>Pickup End:</label><br>
        <input type="text" name="pickup_end" value="{{ box[8] }}" required><br><br>

        <label>Eco Points Reward:</label><br>
        <input type="number" name="eco_points" value="{{ box[9] }}" required><br><br>

        <button type="submit">Update Box</button>
    </form>
    <br>
    <a href="/vendor/dashboard">Cancel</a>
</body>
</html>
