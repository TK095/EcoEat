{% extends "base.html" %}

{% block title %}Edit Surprise Box{% endblock %}

{% block body_class %}role-vendor{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="eco-card">
            <div class="eco-card-header">
                <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit surprise box</h4>
            </div>
            <div class="eco-card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Title *</label>
                            <input type="text" name="title" class="form-control" value="{{ box[2] }}" required>
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">Description *</label>
                            <textarea name="description" rows="3" class="form-control" required>{{ box[3] }}</textarea>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Original Price ($) *</label>
                            <input type="number" step="0.01" name="original_price" class="form-control" value="{{ box[4] }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Discounted Price ($) *</label>
                            <input type="number" step="0.01" name="discounted_price" class="form-control" value="{{ box[5] }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quantity Available *</label>
                            <input type="number" name="quantity" class="form-control" value="{{ box[6] }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Eco Points Reward</label>
                            <input type="number" name="eco_points" class="form-control" value="{{ box[9] }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Pickup Start *</label>
                            <input type="datetime-local" name="pickup_start" class="form-control" value="{{ box[7] }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Pickup End *</label>
                            <input type="datetime-local" name="pickup_end" class="form-control" value="{{ box[8] }}" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-eco-outline"><i class="bi bi-save me-1"></i>Update box</button>
                    <a href="/vendor/dashboard" class="btn btn-eco-ghost">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
