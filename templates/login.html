<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
</head>
<body>

    <h1>Student Login</h1>

    <form method="POST">

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>

    </form>

    <br>

    <a href="/register">Create New Account</a>

</body>
</html>
