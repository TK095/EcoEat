{% extends "base.html" %}

{% block title %}{% if is_edit %}Edit Student{% else %}Add Student{% endif %}{% endblock %}

{% block body_class %}role-admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">{% if is_edit %}Edit Student{% else %}Add Student{% endif %}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" required
                               value="{{ student[1] if student else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required
                               value="{{ student[2] if student else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password{% if is_edit %} <small class="text-muted">(leave blank to keep current)</small>{% endif %}</label>
                        <input type="password" name="password" class="form-control" {% if not is_edit %}required{% endif %}>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Eco Points</label>
                        <input type="number" name="eco_points" class="form-control" min="0"
                               value="{{ student[3] if student else 0 }}">
                    </div>
                    <button type="submit" class="btn btn-success">{% if is_edit %}Save Changes{% else %}Add Student{% endif %}</button>
                    <a href="/admin/students" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
