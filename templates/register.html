{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block body_class %}role-guest{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="eco-card">
            <div class="eco-card-header">
                <h4 class="mb-0">Create account</h4>
            </div>
            <div class="eco-card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full name</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-eco w-100">Register</button>
                </form>
                <p class="mt-3 mb-0 text-center text-muted small">
                    Already registered? <a href="/login" style="color: var(--primary);">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
