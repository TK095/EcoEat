<!DOCTYPE html>
<html>
<head>
    <title>Add Surprise Box</title>
</head>
<body>
    <h1>Add a New Surprise Box</h1>
    <form method="POST">
        <label>Title:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Description:</label><br>
        <textarea name="description" rows="3" cols="40" required></textarea><br><br>

        <label>Original Price ($):</label><br>
        <input type="number" step="0.01" name="original_price" required><br><br>

        <label>Discounted Price ($):</label><br>
        <input type="number" step="0.01" name="discounted_price" required><br><br>

        <label>Quantity Available:</label><br>
        <input type="number" name="quantity" required><br><br>

        <label>Pickup Start (YYYY-MM-DD HH:MM:SS):</label><br>
        <input type="text" name="pickup_start" placeholder="2025-05-25 18:00:00" required><br><br>

        <label>Pickup End:</label><br>
        <input type="text" name="pickup_end" placeholder="2025-05-25 20:00:00" required><br><br>

        <label>Eco Points Reward:</label><br>
        <input type="number" name="eco_points" value="10" required><br><br>

        <button type="submit">Add Box</button>
    </form>
    <br>
    <a href="/vendor/dashboard">Back to Dashboard</a>
</body>
</html>
